[project]
name = "mcp-os"
version = "0.1.0"
description = "A sandboxed file-system MCP server served over HTTP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mcp-os" }]
keywords = ["mcp", "model-context-protocol", "filesystem", "llm"]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27",
    "starlette>=0.37",
]

[project.scripts]
mcp-os = "mcp_os.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_os"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
