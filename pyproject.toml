[project]
name = "microfish"
version = "1.0.0"
description = "Microfish — a small-capital trading quant: ensemble signals, risk-managed sizing, cost-aware backtesting"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
microfish = "microfish.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["microfish*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
